---

- name: "create user Playbook"
  hosts: localhost
  gather_facts: no
  tasks:
    - name: "load configs"
      include_vars:
        file: data/config.yml
        name: configs

    - name: "load args"
      include_vars:
        file: "data/args.json"
        name: robot_args

    - name: "validate args"
      include_tasks: tasks/validate_args.yml

    - name: "looping role grant_admin"
      include_role:
        name: grant_admin
      vars:
        admin: "{{ item }}"
        users: "{{ robot_args.users }}"
      with_items:
        - "{{ robot_args.admins }}"

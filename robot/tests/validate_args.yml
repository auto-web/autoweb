---
# Test of tasks/validate_args.yml, run by tests/validate_args.sh with: -e '{"robot_args": <case>}'

- name: "validate_args test"
  hosts: localhost
  gather_facts: no
  vars:
    configs:
      domain_users: "autoweb.example.org"
      ansible_mysql_login: "ansible"
      chroot_path: "/data/chroot"
  tasks:
    - name: "validate args"
      include_tasks: ../tasks/validate_args.yml

---

- name: "create user Playbook"
  hosts: localhost
  gather_facts: no
  tasks:

    - name: "load configs"
      include_vars:
        file: data/config.yml
        name: configs

    - name: "load args"
      include_vars:
        file: "data/args.json"
        name: robot_args

    - name: "validate args"
      include_tasks: tasks/validate_args.yml

    - name: "looping role create_user"
      include_role:
        name: create_user
      vars:
        user: "{{ item }}"
        admins: "{{ robot_args.admins }}"
      with_items:
        - "{{ robot_args.users }}"
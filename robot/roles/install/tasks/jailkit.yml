---

# Debian package (same paths as the former build from the sources: /usr/sbin/jk_*, /etc/jailkit/).
# On a server where jailkit was built with make install, the package replaces these files;
# /etc/jailkit/jk_init.ini is then copied below. force-confold: the other .ini files are kept.
- name: "Install Jailkit"
  apt:
    name: jailkit
    state: present
    dpkg_options: "force-confdef,force-confold"

- name: Ensure group "jailkit" exists
  group:
    name: jailkit
    state: present

- name: "Copy jk_init.ini"
  copy:
    src: files/jailkit/jk_init.ini
    dest: /etc/jailkit/jk_init.ini
    owner: root
    group: root
    mode: '0644'
  register: jk_init_ini

- name: "Jailkit mkdir {{ configs.chroot_path }}"
  file:
    path: "{{ configs.chroot_path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: "Check if the jail is initialized"
  stat:
    path: "{{ configs.chroot_path }}/bin"
  register: jail_bin

# On the first install, and each time jk_init.ini changes (new PHP versions, paths...):
# jk_update (autoweb_refresh_jail) only updates the files already in the jail
- name: "Jailkit jk_init -j {{ configs.chroot_path }}/ autoweb"
  command:
    cmd: "jk_init -j {{ configs.chroot_path }}/ autoweb"
  when: jk_init_ini.changed or not jail_bin.stat.exists
  notify: Refresh jail

- name: "Copy autoweb_refresh_jail"
  template:
    src: "templates/jailkit/autoweb_refresh_jail.j2"
    dest: "/usr/local/sbin/autoweb_refresh_jail"
    mode: 0744
---

- name: "change /opt/autoweb/data permission"
  file:
    path: "/opt/autoweb/data"
    state: directory
    owner: "root"
    group: "root"
    mode: 0750
  tags: always

- name: "import : limits"
  import_tasks: limits.yml
  tags: system

- name: "import : dns"
  import_tasks: dns.yml
  tags: dns

- name: "import : letsencrypt"
  import_tasks: letsencrypt.yml
  tags: tls

- name: "import : web_install"
  import_tasks: web_install.yml
  tags: web

- name: "import : web_base_config"
  import_tasks: web_base_config.yml
  tags: web

# After web_install: jk_init copies the PHP binaries into the jail
- name: "import : jailkit"
  import_tasks: jailkit.yml
  tags: jail

- name: "import : phpmyadmin"
  import_tasks: phpmyadmin.yml
  tags: phpmyadmin

- name: "import : autoweb"
  import_tasks: autoweb.yml
  tags: interface

- name: "import : sftp"
  import_tasks: sftp.yml
  tags: sftp

- name: "import : logrotate"
  import_tasks: logrotate.yml
  tags: system

- name: "import : sendmailwrapper"
  import_tasks: sendmailwrapper.yml
  tags: mail

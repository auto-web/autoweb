---

- name: "Install apache2"
  apt:
    name:
      - apache2
      - apache2-suexec-custom
      - libapache2-mod-fcgid
    state: present
  notify:
    - Restart apache2

- name: "Install ftpcopy"
  apt:
    name:
      - ftpcopy
    state: present

# Same Debian release as the server (ansible_facts.distribution_release), e.g. trixie
- name: "Add PHP repo. source"
  copy:
    dest: "/etc/apt/sources.list.d/php.list"
    content: "deb https://packages.sury.org/php/ {{ ansible_facts.distribution_release }} main"
  register: php_repo_source

- name: "Add PHP repo. key"
  get_url:
    url: "https://packages.sury.org/php/apt.gpg"
    dest: "/etc/apt/trusted.gpg.d/php.gpg"
  register: php_repo_key

# cache_valid_time below would skip the update right after the repository is added or changed
- name: "Update apt cache for the PHP repo."
  apt:
    update_cache: yes
  when: php_repo_source.changed or php_repo_key.changed

- name: "Install PHP versions"
  apt:
    update_cache: yes
    cache_valid_time: 3600
    name:
      - "php{{ item }}"
      - "php{{ item }}-cgi"
      - "php{{ item }}-cli"
      - "php{{ item }}-mysql"
      - "php{{ item }}-gd"
      - "php{{ item }}-curl"
      - "php{{ item }}-zip"
      - "php{{ item }}-mbstring"
      - "php{{ item }}-xml"
      - "php{{ item }}-imap"
      - "php{{ item }}-sqlite3"
      - "php{{ item }}-bz2"
      - "php{{ item }}-xmlrpc"
      - "php{{ item }}-soap"
      - "php{{ item }}-intl"
    state: present
  loop:
    - "8.2"
    - "8.3"
    - "8.4"
    - "8.5"

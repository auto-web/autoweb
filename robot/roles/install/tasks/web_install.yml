---

- name: "Install apache2"
  apt:
    name:
      - apache2
      - apache2-suexec-custom
      - libapache2-mod-fcgid
    state: present
  notify:
    - Restart apache2

- name: "Install ftpcopy"
  apt:
    name:
      - ftpcopy
    state: present

# Signing key of the Sury repositories (/usr/share/keyrings/debsuryorg-archive-keyring.gpg)
- name: "Install PHP repo. key"
  apt:
    deb: "https://packages.sury.org/debsuryorg-archive-keyring.deb"
  register: php_repo_key

# Former key, trusted for all the repositories: replaced by the signed-by keyring above
- name: "Remove former PHP repo. key"
  file:
    path: "/etc/apt/trusted.gpg.d/php.gpg"
    state: absent
  register: php_repo_old_key

# Same Debian release as the server (ansible_facts.distribution_release), e.g. trixie
- name: "Add PHP repo. source"
  copy:
    dest: "/etc/apt/sources.list.d/php.list"
    content: >
      deb [signed-by=/usr/share/keyrings/debsuryorg-archive-keyring.gpg]
      https://packages.sury.org/php/ {{ ansible_facts.distribution_release }} main
  register: php_repo_source

# cache_valid_time below would skip the update right after the repository is added or changed
- name: "Update apt cache for the PHP repo."
  apt:
    update_cache: yes
  when: php_repo_source.changed or php_repo_key.changed or php_repo_old_key.changed

- name: "Install PHP versions"
  apt:
    update_cache: yes
    cache_valid_time: 3600
    name:
      - "php{{ item }}"
      - "php{{ item }}-cgi"
      - "php{{ item }}-cli"
      - "php{{ item }}-mysql"
      - "php{{ item }}-gd"
      - "php{{ item }}-curl"
      - "php{{ item }}-zip"
      - "php{{ item }}-mbstring"
      - "php{{ item }}-xml"
      - "php{{ item }}-imap"
      - "php{{ item }}-sqlite3"
      - "php{{ item }}-bz2"
      - "php{{ item }}-xmlrpc"
      - "php{{ item }}-soap"
      - "php{{ item }}-intl"
    state: present
  loop:
    - "8.2"
    - "8.3"
    - "8.4"
    - "8.5"

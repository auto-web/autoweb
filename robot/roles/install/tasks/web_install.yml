---

- name: "Install apache2"
  apt:
    name:
      - apache2
      - apache2-suexec-custom
      - libapache2-mod-fcgid
    state: present
  notify:
    - Restart apache2

- name: "Install ftpcopy"
  apt:
    name:
      - ftpcopy
    state: present

- name: "Add PHP repo. source"
  copy:
    dest: "/etc/apt/sources.list.d/php.list"
    content: "deb https://packages.sury.org/php/ bullseye main"

- name: "Add PHP repo. key"
  get_url:
    url: "https://packages.sury.org/php/apt.gpg"
    dest: "/etc/apt/trusted.gpg.d/php.gpg"

- name: "Install PHP versions"
  apt:
    update_cache: yes
    name:
      - "php{{ item }}"
      - "php{{ item }}-cgi"
      - "php{{ item }}-cli"
      - "php{{ item }}-mysql"
      - "php{{ item }}-gd"
      - "php{{ item }}-curl"
      - "php{{ item }}-zip"
      - "php{{ item }}-mbstring"
      - "php{{ item }}-xml"
      - "php{{ item }}-imap"
      - "php{{ item }}-sqlite3"
      - "php{{ item }}-bz2"
      - "php{{ item }}-xmlrpc"
      - "php{{ item }}-soap"
      - "php{{ item }}-intl"
    state: present
  loop:
    - "8.2"
    - "8.3"
    - "8.4"
    - "8.5"

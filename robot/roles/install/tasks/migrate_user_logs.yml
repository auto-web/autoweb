---
# One-time migration (see UPGRADE.md), only run with: ansible-playbook install.yml --tags migrate-user-logs
# The Apache logs of the users move from ~/logs (modifiable by the user) to /var/log/apache2/autoweb/<user>,
# shown read-only in ~/logs (roles/create_user/tasks/logs.yml). The old ~/logs is kept as ~/logs-old.

- name: "Read the autoweb users"
  mysql_query:
    login_db: autoweb
    login_user: "{{ configs.ansible_mysql_login }}"
    login_password: "{{ configs.ansible_mysql_password }}"
    query: "SELECT unix_username, domain_name, php_version, is_admin, is_active FROM autoweb_users"
  register: migrate_users
  changed_when: false
  check_mode: false

# Same checks as the robot playbooks, as these values are used in paths and vhosts
- name: "Validate the autoweb users"
  include_tasks: "{{ playbook_dir }}/tasks/validate_args.yml"
  vars:
    robot_args:
      users: "{{ migrate_users.query_result[0] }}"

- name: "Check the users homes"
  stat:
    path: "{{ configs.chroot_path }}/home/{{ item.unix_username }}"
  loop: "{{ migrate_users.query_result[0] }}"
  loop_control:
    label: "{{ item.unix_username }}"
  register: migrate_homes

# Not moved when ~/logs is already the mount (migration done). mv -T renames ~/logs itself, even a symlink.
- name: "Move the old ~/logs to ~/logs-old"
  shell:
    cmd: |
      logs="{{ configs.chroot_path }}/home/{{ item.item.unix_username }}/logs"
      if { [ -e "$logs" ] || [ -L "$logs" ]; } && ! mountpoint -q "$logs"; then
          old="$logs-old"
          if [ -e "$old" ] || [ -L "$old" ]; then
              old="$old-$(date +%Y%m%d-%H%M%S)"
          fi
          mv -T -- "$logs" "$old"
          echo "moved to $old"
      fi
  loop: "{{ migrate_homes.results }}"
  loop_control:
    label: "{{ item.item.unix_username }}"
  when: item.stat.exists
  register: migrate_moved
  changed_when: "'moved to' in migrate_moved.stdout"

# Active users: new vhost (logs path) + logs mount; disabled users: logs mount only (their vhost stays disabled)
- name: "Set up the new logs of each user"
  include_role:
    name: create_user
    tasks_from: "{{ 'web_config' if migrate_item.item.is_active | int == 1 else 'logs' }}"
    apply:
      tags: [migrate-user-logs]
  # Not "item": the tasks of create_user have their own loops
  loop: "{{ migrate_homes.results }}"
  loop_control:
    loop_var: migrate_item
    label: "{{ migrate_item.item.unix_username }}"
  vars:
    user: "{{ migrate_item.item }}"
  when: migrate_item.stat.exists

- name: "Create mysql autoweb DB"
  ansible.mysql.mysql_db:
    name: "autoweb"
    state: present
    login_user: "{{ configs.ansible_mysql_login }}"
    login_password: "{{ configs.ansible_mysql_password }}"

- name: "Create mysql autoweb"
  no_log: true
  ansible.mysql.mysql_user:
    name: "autoweb"
    password: "{{ configs.autoweb_mysql_password }}"
    host: localhost
    state: present
    priv: "autoweb.*:ALL,GRANT"
    login_user: "{{ configs.ansible_mysql_login }}"
    login_password: "{{ configs.ansible_mysql_password }}"

- name: "Use PHP 8.2 as the default php command line"
  community.general.alternatives:
    name: php
    path: /usr/bin/php8.2

- name: "Create cron job for autoweb robot"
  ansible.builtin.cron:
    name: "autoweb main robot"
    minute: "*"
    job: "/usr/bin/php8.2 /opt/autoweb/interface/robot/robot.php"

- name: "Create cron job for autoweb quotas"
  ansible.builtin.cron:
    name: "autoweb quota robot"
    minute: "*/10"
    job: "/usr/bin/php8.2 /opt/autoweb/interface/robot/quotas_update.php"

- name: add PATH to crontab
  ansible.builtin.cron:
    name: PATH
    env: yes
    job: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

# Group created explicitly: without "group", the user module relies on USERGROUPS_ENAB (/etc/login.defs),
# and puts the user in the default group if a group of the same name already exists
- name: "create autoweb_webadmin group"
  group:
    name: "autoweb_webadmin"
    system: yes
    state: present

- name: "create autoweb_webadmin user"
  user:
    name: "autoweb_webadmin"
    group: "autoweb_webadmin"
    system: yes
    create_home: no
    state: present

- name: "add www-data to autoweb_webadmin group"
  user:
    name: "www-data"
    append: yes
    groups:
      - "autoweb_webadmin"
  notify: Restart apache2

- name: "Mkdir /var/www/fcgi-scripts/autoweb_webadmin"
  file:
    path: "/var/www/fcgi-scripts/autoweb_webadmin"
    state: directory
    owner: "autoweb_webadmin"
    group: "autoweb_webadmin"
    mode: 0550

- name: "Copy php config"
  template:
    src: "templates/web/php-fcgi-starter-autoweb_webadmin.j2"
    dest: "/var/www/fcgi-scripts/autoweb_webadmin/php-fcgi-starter"
    owner: "autoweb_webadmin"
    group: "autoweb_webadmin"
    mode: 0550

# Composer is pinned and checked (the Debian package would pull its own PHP version)
- name: "Install composer"
  get_url:
    url: "https://getcomposer.org/download/2.11.2/composer.phar"
    checksum: "sha256:dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028"
    dest: "/usr/local/bin/composer"
    owner: root
    group: root
    mode: 0755

# Composer does not run as root: system user "autoweb_system" owns the dependencies (interface/vendor).
# autoweb_webadmin (the web interface) can read them but not modify them.
- name: "create autoweb_system group"
  group:
    name: "autoweb_system"
    system: yes
    state: present

# No home: composer runs with --no-cache
- name: "create autoweb_system user (composer)"
  user:
    name: "autoweb_system"
    group: "autoweb_system"
    system: yes
    home: "/nonexistent"
    create_home: no
    shell: /usr/sbin/nologin
    state: present

# become_user below needs sudo (also installed by sendmailwrapper.yml, but with another tag)
- name: "Install sudo"
  apt:
    name: sudo
    state: present

# Also gives back to autoweb_system a vendor/ created by root by the former composer task
- name: "Mkdir /opt/autoweb/interface/vendor"
  file:
    path: "/opt/autoweb/interface/vendor"
    state: directory
    owner: "autoweb_system"
    group: "autoweb_system"
    recurse: yes

# Runs on each play: installs exactly the versions of composer.lock (twig, bootstrap, jquery, phinx)
- name: "Install autoweb dependencies (with composer)"
  community.general.composer:
    command: install
    working_dir: "/opt/autoweb/interface"
    no_dev: true
    optimize_autoloader: true
    arguments: "--no-plugins --no-scripts --no-cache"
    executable: /usr/bin/php8.2
    composer_executable: /usr/local/bin/composer
  become: true
  become_user: "autoweb_system"
  become_method: sudo

- name: "create autoweb config"
  copy:
    dest: "/opt/autoweb/interface/config.php"
    content: |
      <?php
      $domain_name='{{ configs.domain_users }}';
      $dbPassword='{{ configs.autoweb_mysql_password }}';
      $captcha_pubkey='{{ configs.captcha_pubkey }}';
      $quotas_enabled={{ configs.quotas_enabled }};
      $quotas_default={{ configs.quotas_default }};
      $quotas_root='{{ configs.fs }}';
      $sftp_port={{ configs.sftp_port | default(22) | int }};

# Database schema: Phinx migrations of interface/db/migrations (configuration in interface/phinx.php)
# Exit code of "phinx status": 0 = up to date, 3 = pending migrations, other = error
- name: "Check pending autoweb migrations"
  command:
    cmd: "/usr/bin/php8.2 vendor/bin/phinx status -c phinx.php -e production"
    chdir: "/opt/autoweb/interface"
  register: autoweb_migrations
  changed_when: false
  # Read-only: also run with --check, the next tasks need its result
  check_mode: false
  failed_when: autoweb_migrations.rc not in [0, 3]

- name: "Mkdir /var/backups/autoweb"
  file:
    path: "/var/backups/autoweb"
    state: directory
    owner: root
    group: root
    mode: 0700

# Backup before applying migrations (restore with: mariadb autoweb < the dump)
- name: "Backup autoweb DB before migrations"
  command:
    cmd: >-
      mariadb-dump --single-transaction --user={{ configs.ansible_mysql_login }}
      --result-file=/var/backups/autoweb/autoweb-{{ now(fmt='%Y%m%d-%H%M%S') }}.sql autoweb
  environment:
    MYSQL_PWD: "{{ configs.ansible_mysql_password }}"
  when: autoweb_migrations.rc == 3

- name: "Apply autoweb migrations"
  command:
    cmd: "/usr/bin/php8.2 vendor/bin/phinx migrate -c phinx.php -e production"
    chdir: "/opt/autoweb/interface"
  when: autoweb_migrations.rc == 3

# First admin of the web interface, only when there is none.
# Its password is given at install time: ansible-playbook install.yml -e admin_password='...'
- name: "Count autoweb admins"
  ansible.mysql.mysql_query:
    login_db: autoweb
    login_user: "{{ configs.ansible_mysql_login }}"
    login_password: "{{ configs.ansible_mysql_password }}"
    query: "SELECT COUNT(*) AS admins FROM autoweb_users WHERE is_admin = 1"
  register: autoweb_admins
  changed_when: false
  # Read-only: also run with --check, the next tasks need its result
  check_mode: false

# First admin: admin_login and admin_email of config.yml, password given at install time:
#   ansible-playbook install.yml -e admin_password='...'
- name: "Read the first admin parameters"
  no_log: true
  set_fact:
    first_admin:
      login: "{{ configs.admin_login | default('') }}"
      email: "{{ configs.admin_email | default('') }}"
      password: "{{ admin_password | default(configs.admin_password | default(''), true) }}"
  when: autoweb_admins.query_result[0][0].admins == 0

# Same rules as the logins generated by the interface (interface/lib/User.class.php)
- name: "Check the first admin parameters"
  assert:
    that:
      - first_admin.login is match('^[a-z0-9]{1,32}$')
      - first_admin.email is match('^[^@\s]+@[^@\s]+$')
      - first_admin.password | length > 0
    fail_msg: >-
      No admin in the autoweb DB: set admin_login (lowercase letters and digits, 32 max) and admin_email
      in data/config.yml, and run install.yml with -e admin_password='...'
    quiet: true
  when: autoweb_admins.query_result[0][0].admins == 0

- name: "Create the first autoweb admin"
  no_log: true
  ansible.mysql.mysql_query:
    login_db: autoweb
    login_user: "{{ configs.ansible_mysql_login }}"
    login_password: "{{ configs.ansible_mysql_password }}"
    query: >-
      INSERT INTO autoweb_users (id, first_name, last_name, unix_username, unix_password, mysql_username,
      mysql_password, email, domain_name, php_version, description, is_admin, is_active)
      VALUES (%(login)s, %(login)s, %(login)s, %(login)s, %(password)s, %(login)s,
      %(password)s, %(email)s, %(domain)s, '8.2', 'admin', 1, 1)
    named_args:
      login: "{{ first_admin.login }}"
      password: "{{ first_admin.password }}"
      email: "{{ first_admin.email }}"
      domain: "{{ first_admin.login }}.{{ configs.domain_users }}"
  when: autoweb_admins.query_result[0][0].admins == 0



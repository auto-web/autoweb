# Group created explicitly (see the autoweb_webadmin user in autoweb.yml)
- name: "create phpmyadmin group"
  group:
    name: "phpmyadmin"
    system: yes
    state: present

- name: "create phpmyadmin user"
  user:
    name: "phpmyadmin"
    group: "phpmyadmin"
    system: yes
    create_home: no
    state: present

- name: "add www-data to phpmyadmin group"
  user:
    name: "www-data"
    append: yes
    groups:
      - "phpmyadmin"
  notify: Restart apache2

- name: "Mkdir /var/www/fcgi-scripts/phpmyadmin"
  file:
    path: "/var/www/fcgi-scripts/phpmyadmin"
    state: directory
    owner: "phpmyadmin"
    group: "phpmyadmin"
    mode: 0550

- name: "Copy php config"
  template:
    src: "templates/web/php-fcgi-starter-phpmyadmin.j2"
    dest: "/var/www/fcgi-scripts/phpmyadmin/php-fcgi-starter"
    owner: "phpmyadmin"
    group: "phpmyadmin"
    mode: 0550
  notify: Restart apache2

# phpMyAdmin is in Debian main (trixie and later): the bullseye-backports repo is no longer used
- name: "Remove backport repo. source"
  file:
    path: "/etc/apt/sources.list.d/backports.list"
    state: absent
  register: backports_repo

# Forced when the backports repo is removed, so that apt forgets its packages
- name: apt update
  apt:
    update_cache: yes
    cache_valid_time: "{{ 0 if backports_repo.changed else 3600 }}"

- name: install phpmyadmin
  apt:
    name: phpmyadmin
    state: latest
  notify: Restart apache2

- name: set /usr/share/phpmyadmin permissions
  file:
    dest: /usr/share/phpmyadmin
    owner: root
    group: phpmyadmin
    mode: u=rwX,g=rX,o=rX
    recurse: yes
  notify: Restart apache2

- name: set /var/lib/phpmyadmin/tmp permissions
  file:
    dest: /var/lib/phpmyadmin/tmp
    owner: phpmyadmin
    group: phpmyadmin
    mode: u=rwX,g=rX,o=rX
    recurse: yes
  notify: Restart apache2

- name: set /var/lib/phpmyadmin/blowfish_secret.inc.php permissions
  file:
    dest: /var/lib/phpmyadmin/blowfish_secret.inc.php
    owner: root
    group: phpmyadmin
    mode: u=rwX,g=r
  notify: Restart apache2


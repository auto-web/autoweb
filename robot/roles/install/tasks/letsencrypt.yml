---

- name: "Install letsencrypt certbot"
  apt:
    name: certbot
    state: present

- name: "Install letsencrypt certbot RFC 2136 plugin"
  apt:
    name: python3-certbot-dns-rfc2136
    state: present

# Key generated by dns.yml (tag dns)
- name: "Get bind9 secret key"
  slurp:
    src: /etc/bind/letsencrypt_wildcard.key
  register: letsencrypt_wildcard_key_file

- name: "Extract bind9 secret key"
  set_fact:
    letsencrypt_wildcard_secret: >-
      {{ letsencrypt_wildcard_key_file.content | b64decode
         | regex_search('secret "([^"]+)"', '\1') | default([''], true) | first }}
  no_log: true

- name: "Check bind9 secret key"
  assert:
    that: letsencrypt_wildcard_secret | length > 0
    fail_msg: "No secret in /etc/bind/letsencrypt_wildcard.key: run install.yml with --tags dns to generate it"
    quiet: true

- name: "Mkdir /etc/letsencrypt/secrets"
  file:
    path: "/etc/letsencrypt/secrets"
    owner: root
    group: root
    mode: 0700
    state: directory

- name: "Copy bind9 secret to letsencrypt configuration"
  template:
    src: "templates/letsencrypt/rfc2136-credentials.ini.j2"
    dest: "/etc/letsencrypt/secrets/rfc2136-credentials.ini"
    owner: "root"
    group: "root"
    mode: 0600

- name: "Generate letsencrypt wildcard certificate"
  command:
    cmd: >-
      certbot certonly --non-interactive --agree-tos -m {{ configs.letsencrypt_email }}
      --dns-rfc2136 --dns-rfc2136-credentials /etc/letsencrypt/secrets/rfc2136-credentials.ini
      -d {{ configs.domain_users }} -d *.{{ configs.domain_users }}
    creates: /etc/letsencrypt/live/{{ configs.domain_users }}


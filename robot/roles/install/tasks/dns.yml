---

- name: "Install bind9"
  apt:
    name: bind9
    state: present
  notify: Restart bind9

- name: "Copy dns conf"
  copy:
    src: "files/dns/"
    dest: "/etc/bind/"
    owner: root
    group: root
    mode: 0755
  notify: Restart bind9

- name: "Mkdir /etc/bind/zones.autoweb"
  file:
    path: "/etc/bind/zones.autoweb"
    state: directory

- name: "Mkdir /var/lib/bind/zones.autoweb"
  file:
    path: "/var/lib/bind/zones.autoweb"
    owner: root
    group: bind
    mode: 0775
    state: directory

- name: "Copy services conf"
  template:
    src: "templates/dns/services.j2"
    dest: "/etc/bind/zones.autoweb/services"
    owner: root
    group: root
    mode: 0644
  notify: Restart bind9

- name: "Copy pri.phpmyadmin"
  template:
    src: "templates/dns/pri.zone.phpmyadmin.j2"
    dest: "/etc/bind/zones.autoweb/pri.phpmyadmin"
    owner: root
    group: root
    mode: 0644
  notify: Restart bind9

- name: "Copy pri.autoweb"
  template:
    src: "templates/dns/pri.zone.autoweb.j2"
    dest: "/var/lib/bind/zones.autoweb/pri.autoweb"
    owner: root
    group: bind
    mode: 0664
  notify: Restart bind9

- name: "Mkdir /etc/bind/zones.autoweb/master.fragments"
  file:
    path: "/etc/bind/zones.autoweb/master.fragments"
    state: directory

- name: "touch /etc/bind/zones.autoweb/master"
  file:
    path: "/etc/bind/zones.autoweb/master"
    state: touch

# TSIG key used by certbot (letsencrypt.yml) to update the _acme-challenge records
- name: "Read HMAC key for Bind9"
  slurp:
    src: /etc/bind/letsencrypt_wildcard.key
  register: bind_letsencrypt_key
  failed_when: false

# Generated when missing or without secret (a failed "tsig-keygen > file" used to leave an empty file).
# Through a temporary file: the key file is only replaced by a valid key.
- name: "Generate HMAC key for Bind9"
  shell:
    cmd: |
      set -e
      umask 077
      tsig-keygen -a hmac-sha512 letsencrypt_wildcard > /etc/bind/letsencrypt_wildcard.key.tmp
      grep -q 'secret "' /etc/bind/letsencrypt_wildcard.key.tmp
      mv /etc/bind/letsencrypt_wildcard.key.tmp /etc/bind/letsencrypt_wildcard.key
  when: >-
    bind_letsencrypt_key.content is not defined
    or (bind_letsencrypt_key.content | b64decode) is not search('secret "[^"]+"')
  notify: Restart bind9

# Readable by named (user bind), not by everyone
- name: "Set HMAC key for Bind9 permissions"
  file:
    path: /etc/bind/letsencrypt_wildcard.key
    owner: root
    group: bind
    mode: 0640
  notify: Restart bind9

- name: "Start service bind9"
  service:
    name: bind9
    state: started
    enabled: yes

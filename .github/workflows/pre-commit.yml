---
# Run the pre-commit hooks (defined in .pre-commit-config.yaml): yaml lint, php lint, PSR2 coding style...
name: pre-commit

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pre-commit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # PHP version used by the interface, with phpcs for the php-cs hook
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: phpcs

      # twig-cs-fixer for the twig-cs-fixer hook
      - name: Install twig-cs-fixer
        env:
          TWIG_CS_FIXER_VERSION: 4.1.2
        run: |
          sudo curl -sSfL -o /usr/local/bin/twig-cs-fixer \
            "https://github.com/VincentLanglet/Twig-CS-Fixer/releases/download/${TWIG_CS_FIXER_VERSION}/twig-cs-fixer.phar"
          sudo chmod +x /usr/local/bin/twig-cs-fixer

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pre-commit

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit/
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        env:
          # no-commit-to-branch makes no sense in the CI (it would fail on push to master)
          SKIP: no-commit-to-branch
        run: pre-commit run --show-diff-on-failure --color=always --all-files

  # Composer dependencies of the interface (twig, bootstrap, jquery)
  composer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      # --no-check-publish: the interface is not a published package (name, description, license)
      - name: Validate composer.json and composer.lock
        run: composer validate --no-check-publish

      - name: Install the locked dependencies
        run: composer install --no-dev --no-plugins --no-scripts --no-progress

      - name: Check that the front-end files served by Apache exist
        run: >-
          ls vendor/twbs/bootstrap/dist/css/bootstrap.min.css
          vendor/twbs/bootstrap/dist/js/bootstrap.bundle.min.js
          vendor/components/jquery/jquery.min.js

      - name: Check for security advisories
        run: composer audit --locked
